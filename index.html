<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="add(1)">teste</button>
    <button onclick="add(-1)">teste</button>
    <p id="counter1">0</p>

    <script>
        let counter = 0
        let counter1 = document.getElementById('counter1')

        const add = (x) =>{
        counter = counter + x
        counter1.innerText = counter
        return
        }
    </script>
</body>
</html>
