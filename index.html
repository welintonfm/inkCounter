<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Counter | MTG Life Counter for E-ink devices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    
</head>
<body>
    <div class="container">
        <div class="player" style="transform: rotate(180deg);">
            <p>Player 2</p>
            <div class="lifeCounter">
                <button onclick="add(-1, 2)" style="padding-bottom: 24px">-</button>
                <p id="counter2" class="life">0</p>
                <button onclick="add(1, 2)">+</button>
            </div>
            <div class="lifeButtons">
                <button onclick="add(-10, 2)">-10</button>
                <button onclick="add(-5, 2)">-5</button>
                <button onclick="add(5, 2)">+5</button>
                <button onclick="add(10, 2)">+10</button>
            </div>
        </div>
        <div class="player">
            <p>Player 1</p>
            <div class="lifeCounter">
                <button onclick="add(-1, 1)" style="padding-bottom: 24px">-</button>
                <p id="counter1" class="life">0</p>
                <button onclick="add(1, 1)">+</button>
            </div>
            <div class="lifeButtons">
                <button onclick="add(-10, 1)">-10</button>
                <button onclick="add(-5, 1)">-5</button>
                <button onclick="add(5, 1)">+5</button>
                <button onclick="add(10, 1)">+10</button>
            </div>
            <div class="resetRow">
                <button onclick="reset()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        let life1 = 20
        let life2 = 20
        let counter1 = document.getElementById('counter1')
        let counter2 = document.getElementById('counter2')
        counter1.innerText = life1
        counter2.innerText = life2

        const add = (x, player) =>{
            if(player == 1){
                life1 += x
                counter1.innerText = life1
            } else {
                life2 += x
                counter2.innerText = life2
            }
        }

        const reset = () =>{
            life1 = 20
            life2 = 20
            counter1.innerText = life1
            counter2.innerText = life2
        }
    </script>
</body>
</html>
